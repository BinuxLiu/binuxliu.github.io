<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0;url=en/index.html">
  <title>Bingxi (Binux) Liu</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Auto-redirect based on browser language
    (function(){
      var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      var target = lang.startsWith('zh') ? 'zh/index.html' : 'en/index.html';
      // Override meta refresh
      document.querySelector('meta[http-equiv="refresh"]').setAttribute('content', '0;url=' + target);
    })();
  </script>
</head>
<body>
  <div class="bg-stars"></div>
  <div class="bg-grid"></div>
  <canvas id="particles"></canvas>

  <div class="entry">
    <div class="header-shield" style="margin-bottom:24px">
      <img class="profile-img" src="assets/images/photo.jpg" alt="Bingxi Liu" style="width:100px;height:100px">
    </div>
    <h1 style="font-size:2rem;margin-bottom:8px">Bingxi (Binux) Liu</h1>
    <p style="color:var(--text-dim);margin-bottom:32px">Redirecting…</p>
    <div class="lang-choices">
      <a href="en/index.html">English</a>
      <a href="zh/index.html">中文</a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
